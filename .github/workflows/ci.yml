name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
        node: [true, false]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        if: matrix.node
        with:
          node-version: "20"
      - name: Install the test-only npm packages (axe-core, jsdom; Ruling P4-17)
        if: matrix.node
        run: npm ci --prefix tests/js
      - name: Remove Node so the JS tests skip
        if: ${{ !matrix.node }}
        run: |
          # ubuntu-latest ships node; the JS tests skip only when shutil.which("node") finds none
          for i in $(seq 1 20); do
            p=$(command -v node) || break
            sudo rm -f "$p"
            hash -r
          done
          if command -v node; then echo "node is still on PATH"; exit 1; fi
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Enable subprocess coverage
        run: |
          purelib=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "import coverage; coverage.process_startup()" > "$purelib/pmlc-cov.pth"
      - name: Tests with coverage
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
        run: coverage run -m pytest tests -q
      - name: Check the JS tests skipped without Node
        if: ${{ !matrix.node }}
        run: |
          set -o pipefail
          # -v prints one raw SKIPPED line per test (-rs would merge identical skip lines); COLUMNS keeps the reason untruncated
          COLUMNS=200 python -m pytest tests/test_pack_js.py tests/test_detail_js.py tests/test_a11y_js.py -v | tee js.txt
          want=$(cat tests/test_pack_js.py tests/test_detail_js.py tests/test_a11y_js.py | grep -c "skipif(not NODE" || true)
          # one skipif marker per test function; a parametrized function skips once per case, so count functions
          got=$(grep "SKIPPED (node not installed)" js.txt | sed -E 's/(\[[^]]*\])? SKIPPED.*//' | sort -u | wc -l)
          echo "node tests: $want, skipped for no node: $got"
          if [ "$got" -ne "$want" ] || [ "$want" -eq 0 ]; then echo "the Node tests did not all skip"; exit 1; fi
      - run: coverage combine
      - run: coverage report
      - name: Guard - subprocess coverage must be measured
        run: |
          set -o pipefail
          # pmlc_lib/pack/ is exercised mostly through the engine subprocess; 0% means the .pth hook did nothing
          line=$(coverage report --include='*/pmlc_lib/pack/*' --fail-under=0 | grep "^TOTAL" || true)
          echo "$line"
          if [ -z "$line" ] || echo "$line" | awk '{for (i = 1; i <= NF; i++) if ($i ~ /%$/) { print $i; exit }}' | grep -qx "0%"; then
            echo "subprocess coverage was not measured"; exit 1
          fi
      - run: python skills/learnings-coach/scripts/pmlc.py check-samples
      - run: python evals/run_evals.py check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python tools/smoke_sample.py
